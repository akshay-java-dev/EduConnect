{% extends "base.html" %}{% block content %}<div class="auth-wrap"><div class="glass-card auth-card reveal"><span class="eyebrow">START LEARNING</span><h2 class="mt-2">Create student account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name</label><input class="form-control mb-3" name="name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password (8+ characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><label>Confirm password</label><input class="form-control mb-4" type="password" name="confirm_password" minlength="8" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3">Already registered? <a href="{{url_for('auth.login')}}">Login</a></p></div></div>{% endblock %}
