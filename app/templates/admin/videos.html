{% extends "base.html" %}{% block content %}<h1>Video Lectures</h1><div class="glass-card my-3"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row g-3"><div class="col-md-6"><input class="form-control" name="title" placeholder="Video title" required></div><div class="col-md-6"><input class="form-control" name="subject_name" list="subjects" placeholder="Type subject" required><datalist id="subjects">{% for v in videos %}<option value="{{v.subject.name}}">{% endfor %}</datalist></div><div class="col-12"><input class="form-control" type="url" name="video_url" placeholder="https:// video URL" required></div><div class="col-12"><input class="form-control" name="description" placeholder="Description"></div><div class="col-12"><button class="btn btn-primary">Add video</button></div></div></form></div>{% for v in videos %}<div class="glass-card my-2"><span class="pill">{{v.subject.name}}</span><h5>{{v.title}}</h5><a href="{{v.video_url}}" target="_blank">Watch ↗</a><form method="post" action="{{url_for('admin.delete_video',vid=v.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-danger mt-2">Delete</button></form></div>{% endfor %}{% endblock %}
