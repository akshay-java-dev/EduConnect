{% extends "base.html" %}{% block content %}<h1>{{exam.title}}</h1><div class="glass-card my-3"><h4>Add question</h4><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><textarea class="form-control mb-3" name="prompt" placeholder="Question" required></textarea><div class="row g-2"><div class="col-md-6"><select class="form-select" name="question_type" id="kind"><option value="mcq">MCQ</option><option value="written">Written</option></select></div><div class="col-md-6"><input class="form-control" type="number" name="marks" min="1" value="1"></div></div><div id="opts" class="row g-2 mt-2">{% for x in 'abcd' %}<div class="col-md-6"><input class="form-control" name="option_{{x}}" placeholder="Option {{x|upper}}"></div>{% endfor %}<div class="col-md-6"><select class="form-select" name="correct_option"><option>A</option><option>B</option><option>C</option><option>D</option></select></div></div><button class="btn btn-primary mt-3">Add question</button></form></div><div class="glass-card"><h4>Questions</h4>{% for q in exam.questions %}<p class="border-bottom border-secondary py-2">{{loop.index}}. {{q.prompt}} <small class="text-secondary">({{q.question_type}}, {{q.marks}} marks)</small></p>{% else %}<p>No questions yet.</p>{% endfor %}</div><script>document.getElementById('kind').addEventListener('change',e=>document.getElementById('opts').style.display=e.target.value==='mcq'?'flex':'none');</script>{% endblock %}
