{% extends "base.html" %}{% block content %}<h1>PDF Notes</h1><div class="glass-card my-3"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row g-3"><div class="col-md-6"><input class="form-control" name="title" placeholder="Title" required></div><div class="col-md-6"><input class="form-control" name="subject_name" list="subjects" placeholder="Type subject (new or existing)" required><datalist id="subjects">{% for n in notes %}<option value="{{n.subject.name}}">{% endfor %}</datalist></div><div class="col-12"><input class="form-control" name="description" placeholder="Description"></div><div class="col-md-8"><input class="form-control" type="file" name="pdf" accept="application/pdf" required></div><div class="col-md-4"><button class="btn btn-primary w-100">Upload PDF</button></div></div></form></div><div class="row g-3">{% for n in notes %}<div class="col-md-4"><div class="glass-card"><span class="pill">{{n.subject.name}}</span><h5 class="mt-2">{{n.title}}</h5><a href="{{url_for('main.download_note',nid=n.id)}}">Download</a><form method="post" action="{{url_for('admin.delete_note',nid=n.id)}}" class="mt-2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete note?')">Delete</button></form></div></div>{% endfor %}</div>{% endblock %}
