{% extends "base.html" %}{% block content %}<h1>Manual Grading</h1><div class="glass-card table-responsive mt-3"><table class="table table-dark"><tr><th>Student</th><th>Exam</th><th>Score</th><th></th></tr>{% for s in submissions %}<tr><td>{{s.student.name}}</td><td>{{s.exam.title}}</td><td>{{s.score}}</td><td><a href="{{url_for('admin.grade',sid=s.id)}}">Grade</a></td></tr>{% else %}<tr><td colspan="4">No submitted exams.</td></tr>{% endfor %}</table></div>{% endblock %}
